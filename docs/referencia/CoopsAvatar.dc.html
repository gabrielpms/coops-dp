<script type="text/x-dc" data-dc-script data-props='{"skin":{"editor":"color","default":"#FFFFFF","options":["#FFFFFF","#F2D3BC","#E0B08A","#C68B5E","#8D5A3B","#5A3825"]},"bg":{"editor":"color","default":"#F2F1EE","options":["#F2F1EE","#B7A6FF","#F3D36B","#F5A9D6","#FF8A5B"]},"hairStyle":{"editor":"enum","options":["curto","cacheado","chanel","longo","coque","careca","blackpower","afro-curto","trancas","dreads","rabo","ondulado","topete"],"default":"curto"},"shirtStyle":{"editor":"enum","options":["preta","clara","listrada","blazer","gola-alta","camisa"],"default":"clara"},"facialHair":{"editor":"enum","options":["nenhum","bigode","barba","barba-cheia","cavanhaque"],"default":"nenhum"},"glasses":{"editor":"boolean","default":false},"glassesShape":{"editor":"enum","options":["redondo","quadrado"],"default":"redondo"},"earrings":{"editor":"boolean","default":false},"lashes":{"editor":"boolean","default":false},"crown":{"editor":"boolean","default":false},"size":{"editor":"int","default":160,"min":24,"max":320},"label":{"editor":null,"default":"Avatar"},"hair":{"editor":null},"shirt":{"editor":null},"$preview":{"width":160,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var st = p.hairStyle ?? 'curto';
    var sh = p.shirtStyle ?? 'clara';
    var fh = p.facialHair ?? 'nenhum';
    var gl = !!p.glasses;
    var gs = p.glassesShape ?? 'redondo';
    function d(on) { return on ? 'inline' : 'none'; }
    var full = fh === 'barba-cheia';
    return {
      size: p.size ?? 160,
      skin: p.skin ?? '#FFFFFF',
      bg: p.bg ?? '#F2F1EE',
      label: p.label ?? 'Avatar',
      shirtFill: (sh === 'preta' || sh === 'gola-alta') ? '#0E0E12' : '#FFFFFF',
      stripesDisplay: d(sh === 'listrada'),
      blazerDisplay: d(sh === 'blazer'),
      collarDisplay: d(sh === 'camisa'),
      turtleDisplay: d(sh === 'gola-alta'),
      crewDisplay: d(sh === 'clara' || sh === 'listrada' || sh === 'blazer'),
      shortDisplay: d(st === 'curto'),
      curlyDisplay: d(st === 'cacheado'),
      bobDisplay: d(st === 'chanel'),
      longDisplay: d(st === 'longo'),
      bunDisplay: d(st === 'coque'),
      baldDisplay: d(st === 'careca'),
      afroDisplay: d(st === 'blackpower'),
      afroShortDisplay: d(st === 'afro-curto'),
      afroFrontDisplay: d(st === 'blackpower' || st === 'afro-curto'),
      braidsDisplay: d(st === 'trancas'),
      dreadsDisplay: d(st === 'dreads'),
      ponyDisplay: d(st === 'rabo'),
      wavyDisplay: d(st === 'ondulado'),
      quiffDisplay: d(st === 'topete'),
      stacheDisplay: d(fh === 'bigode' || full || fh === 'cavanhaque'),
      beardDisplay: d(fh === 'barba'),
      fullBeardDisplay: d(full),
      goateeDisplay: d(fh === 'cavanhaque'),
      mouthStroke: full ? '#FFFFFF' : '#0E0E12',
      browStroke: '#0E0E12',
      roundGlassesDisplay: d(gl && gs === 'redondo'),
      squareGlassesDisplay: d(gl && gs === 'quadrado'),
      earringsDisplay: d(!!p.earrings),
      lashesDisplay: d(!!p.lashes),
      crownDisplay: d(!!p.crown)
    };
  }
}
</script>
